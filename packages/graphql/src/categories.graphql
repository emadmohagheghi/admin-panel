# ---------- دسته‌بندی‌ها ----------
# پرمیشن‌ها (تست‌شده زنده با اکانت سرویس، ۱۰ اکتبر ۲۰۲۶): همه فیلدهای
# CategoryType باز شدند + rootCategories در دسترس است. نکته‌ها:
# - CategoryType فیلد parent ندارد؛ ساختار درختی با rootCategories +
#   children (لیست ساده، هر عمق) ساخته می‌شود.
# - کوئری تکی category(id) در اسکیما نیست؛ جزئیات با node(id) گرفته می‌شود.
# - سقف صفحه‌بندی سرور ۲۰ است و ordering سمت سرور فقط
#   hierarchy/updatedAt قابل استفاده است؛ مرتب‌سازی اختصاصی عمدتاً سمت کلاینت است.

# ریشه‌های درخت دسته‌بندی + فرزندان تا دو عمق (برای صفحه درختی)
query RootCategoriesTree($first: Int = 20, $after: String) {
  rootCategories(first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        slug
        isPublic
        description
        updatedAt
        numchild
        children {
          id
          name
          slug
          isPublic
          description
          numchild
          children {
            id
            name
            slug
            isPublic
            numchild
          }
        }
      }
    }
  }
}

# لیست تخت دسته‌بندی‌ها با فیلتر سروری (جستجوی سروری name/slug) و صفحه‌بندی cursor
query CategoriesList(
  $first: Int
  $after: String
  $filters: CategoryFilterType
  $ordering: [CategoryOrderType!]!
) {
  categories(first: $first, after: $after, filters: $filters, ordering: $ordering) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        slug
        isPublic
        description
        updatedAt
        numchild
      }
    }
  }
}

# جزئیات دسته‌بندی با درخت اجداد و فرزندان — از طریق node(id)
query CategoryDetail($id: ID!) {
  node(id: $id) {
    __typename
    ... on CategoryType {
      id
      name
      slug
      description
      isPublic
      metaTitle
      metaDescription
      updatedAt
      ancestors {
        id
        name
        slug
      }
      children {
        id
        name
        slug
        isPublic
        numchild
      }
    }
  }
}
