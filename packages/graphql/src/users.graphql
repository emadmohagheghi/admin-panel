# ---------- کاربران و گروه‌ها ----------
# لیست کاربران با فیلتر، مرتب‌سازی و صفحه‌بندی cursor
query UsersList(
  $first: Int
  $after: String
  $filters: UserFilterType
  $ordering: [UserOrderType!]!
) {
  users(first: $first, after: $after, filters: $filters, ordering: $ordering) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        email
        firstName
        lastName
        isStaff
        isActive
        isConfirmed
        isSuperuser
        dateJoined
        lastLogin
        onlineStatus
        avatar {
          url
        }
      }
    }
  }
}

query UserDetail($id: ID!) {
  user(id: $id) {
    id
    email
    firstName
    lastName
    description
    isStaff
    isActive
    isConfirmed
    isSuperuser
    dateJoined
    updatedAt
    lastLogin
    languageCode
    onlineStatus
    avatar {
      url
    }
    groups {
      id
      name
    }
    permissions {
      id
      name
      codename
    }
  }
}

# لیست گروه‌های دسترسی
query GroupsList($first: Int, $after: String) {
  groups(first: $first, after: $after) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        name
        permissions {
          id
          name
          codename
        }
      }
    }
  }
}
