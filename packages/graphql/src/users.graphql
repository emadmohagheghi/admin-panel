# ---------- کاربران و گروه‌ها ----------
# نکته‌ی پرمیشن (تست‌شده با اکانت واقعی): فیلدهای id و isSuperuser در
# UserType پشت پرمیشن GROUP_MANAGER و CHECK_SUPERUSER_STATUS قفل‌اند و
# درخواست نمی‌شوند؛ بقیه‌ی فیلدهای زیر باز است.

# لیست کاربران با فیلتر، مرتب‌سازی سروری و صفحه‌بندی cursor
query UsersList(
  $first: Int
  $after: String
  $filters: UserFilterType
  $ordering: [UserOrderType!]!
) {
  users(first: $first, after: $after, filters: $filters, ordering: $ordering) {
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        id
        email
        firstName
        lastName
        isStaff
        isActive
        isConfirmed
        dateJoined
        updatedAt
        lastLogin
        onlineStatus
        languageCode
        avatar {
          url
        }
      }
    }
  }
}

# جزئیات کاربر — بدون id در permissions/groupPermissions چون resolver بک‌اند خطا می‌دهد
query UserDetail($id: ID!) {
  user(id: $id) {
    id
    email
    firstName
    lastName
    description
    metadata
    avatar {
      url
      width
      height
    }
    isStaff
    isActive
    isConfirmed
    isSuperuser
    dateJoined
    updatedAt
    lastLogin
    languageCode
    onlineStatus
    groups {
      id
      name
    }
    permissions {
      name
      codename
    }
    groupPermissions {
      name
      codename
    }
  }
}

# شمارش کاربران برای نمودار radial صفحهٔ users — هر فیلتر boolean یک رینگ
# (نسبت به کل کاربران)؛ کلیک روی هر ردیف همان فیلتر را روی جدول اعمال می‌کند.
query UserFilterStats {
  total: users {
    totalCount
  }
  active: users(filters: { isActive: { exact: true } }) {
    totalCount
  }
  confirmed: users(filters: { isConfirmed: { exact: true } }) {
    totalCount
  }
  staff: users(filters: { isStaff: { exact: true } }) {
    totalCount
  }
  superuser: users(filters: { isSuperuser: { exact: true } }) {
    totalCount
  }
}
